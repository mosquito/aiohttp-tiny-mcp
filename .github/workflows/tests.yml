name: tests

on:
  push:
  pull_request:

# The log is read by people; the tools only colour a terminal unless told.
env:
  FORCE_COLOR: "1"

# The published pages are the deployment; one at a time, and a newer commit
# waits for the running one rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    services:
      # The Redis and PostgreSQL backends are tested against real servers.
      # `MCP_REQUIRE_BACKENDS` below turns a server that did not start into a
      # failure, because a skipped test looks exactly like a passing one.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mcp
          POSTGRES_PASSWORD: mcp
          POSTGRES_DB: mcp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      # The console and the event stream are checked with the runtime that
      # runs them: a browser's JavaScript, and undici's EventSource.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: uv sync --all-groups --all-extras

      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check src/ examples/
      - run: uv run pytest -v --cov
        env:
          POSTGRES_URL: postgresql://mcp:mcp@127.0.0.1:5432/mcp
          MCP_REQUIRE_BACKENDS: "1"
          COVERAGE_FILE: .coverage.lib-${{ matrix.python }}

      # Raw coverage data, not a report: the `coverage` job combines every
      # interpreter and every suite before one number is computed.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lib-${{ matrix.python }}
          path: .coverage.lib-*
          include-hidden-files: true
          if-no-files-found: error

  docker-mcp:
    # The example is a project of its own, with its own lock file, tested the
    # same way as the library.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: examples/docker-mcp
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - run: uv sync --all-groups

      - run: uv run pytest -v --cov=aiohttp_tiny_mcp --cov=docker_mcp --cov-branch
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage.docker-${{ matrix.python }}

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-docker-${{ matrix.python }}
          path: .coverage.docker-*
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    needs: [test, docker-mcp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - run: uv sync --all-groups

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true

      - run: uv run coverage combine
      - run: uv run coverage report
      - run: uv run coverage lcov -o coverage.lcov

      - uses: coverallsapp/github-action@v2.3.8
        with:
          file: coverage.lcov

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - run: uv sync --all-groups --all-extras

      # `-W` because a warning here is a page that renders wrong or a
      # reference that points nowhere, and both read as fine in a log.
      - run: uv run sphinx-build -W --keep-going -b html docs docs/_build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build

  publish:
    # Only the default branch is published, and only where the tests and the
    # documentation both came out green.
    needs: [test, docker-mcp, docs]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
