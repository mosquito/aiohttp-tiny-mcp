[project]
name = "aiohttp-tiny-mcp"
version = "0.1.0"
description = "Remote MCP server and client library for aiohttp"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Framework :: aiohttp",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.14",
    "pydantic>=2.13",
]

[project.urls]
Documentation = "https://mosquito.github.io/aiohttp-tiny-mcp/"
Repository = "https://github.com/mosquito/aiohttp-tiny-mcp"
Issues = "https://github.com/mosquito/aiohttp-tiny-mcp/issues"

[project.optional-dependencies]
# A hub and a session store on one SQLite file: aiohttp_tiny_mcp.sqlite.
sqlite = ["aiosqlite>=0.20"]
redis = [
    "redis>=5",
]
postgres = [
    "psycopg[binary,pool]>=3",
]

[dependency-groups]
dev = [
    "PyJWT>=2.13",
    "aiosqlite>=0.20",
    "furo>=2025.12.19",
    "markdown-pytest>=0.6.6",
    "mcp[cli]==2.0.0",
    "myst-parser>=4.0.1",
    "psycopg[binary,pool]>=3",
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "redis>=5",
    "ruff",
    "sphinx>=8.1.3",
    "sphinxcontrib-mermaid>=2.1.1",
    "ty",
]

[tool.uv.build-backend]
# Include console assets in source distributions as well as wheels.
source-include = ["src/aiohttp_tiny_mcp/console/*.html", "src/aiohttp_tiny_mcp/console/*.css", "src/aiohttp_tiny_mcp/console/*.js"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# A test gets a second. A hung one then fails and names itself rather than
# stopping the run. The few that pay for a process start say so with a marker.
timeout = 1
# Calling a deprecated SDK method is deliberate where it happens, and says so
# with `pytest.warns`. Anywhere else it is a finding, not a log line.
filterwarnings = ["error::mcp.shared.exceptions.MCPDeprecationWarning"]
# Run Python examples in the documentation as tests.
testpaths = ["tests", "docs", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
root = ["src", "examples"]

[tool.ty.src]
# Checked separately with its own dependencies.
exclude = ["examples/docker-mcp"]
