[project]
name = "aiohttp-tiny-mcp"
version = "0.1.0"
description = "Remote MCP server and client library for aiohttp"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Framework :: aiohttp",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.14",
    "pydantic>=2.13",
]

[project.urls]
Documentation = "https://mosquito.github.io/aiohttp-tiny-mcp/"
Repository = "https://github.com/mosquito/aiohttp-tiny-mcp"
Issues = "https://github.com/mosquito/aiohttp-tiny-mcp/issues"

[project.optional-dependencies]
jwt = ["PyJWT[crypto]>=2.13"]
skills = ["PyYAML>=6"]
# A hub and a session store on one SQLite file: aiohttp_tiny_mcp.storage.sqlite.
sqlite = ["aiosqlite>=0.20"]
redis = [
    "redis>=5",
]
postgres = [
    "psycopg[binary,pool]>=3",
]

[dependency-groups]
dev = [
    "PyYAML>=6",
    "PyJWT[crypto]>=2.13",
    "aiosqlite>=0.20",
    "furo>=2025.12.19",
    "markdown-pytest>=0.6.6",
    "mcp[cli]==2.0.0",
    "myst-parser>=4.0.1",
    "psycopg[binary,pool]>=3",
    "pytest",
    "pytest-asyncio",
    "pytest-cov>=7.1.0",
    "pytest-timeout",
    "redis>=5",
    "ruff",
    "sphinx>=8.1.3",
    "sphinxcontrib-mermaid>=2.1.1",
    "ty",
]

[tool.uv.build-backend]
# Include console assets in source distributions as well as wheels.
source-include = ["src/aiohttp_tiny_mcp/console/*.html", "src/aiohttp_tiny_mcp/console/*.css", "src/aiohttp_tiny_mcp/console/*.js"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.coverage.run]
source = ["aiohttp_tiny_mcp"]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The guard against a hung test, not a measure of how fast the machine is. A
# loaded runner is an order of magnitude slower than a laptop, so a budget
# tight enough to catch a wait fails on a slow disk instead. A test that must
# not wait carries its own marker.
timeout = 30
# Calling a deprecated SDK method is deliberate where it happens, and says so
# with `pytest.warns`. Anywhere else it is a finding, not a log line.
filterwarnings = ["error::mcp.shared.exceptions.MCPDeprecationWarning"]
# Run Python examples in the documentation as tests.
testpaths = ["tests", "docs", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ty.environment]
root = ["src", "examples"]

[tool.ty.src]
# Checked separately with its own dependencies.
exclude = ["examples/docker-mcp"]
